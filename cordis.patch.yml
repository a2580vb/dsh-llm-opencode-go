# dsh-llm-opencode-go layer.
#
# Registers one LLM provider route backed by the OpenCode Go relay at
# https://opencode.ai/zen/go/v1, speaking whichever of its three wire protocols
# each model actually serves.
#
# Every key is optional except that a credential must resolve at request time.
# The exhaustive field list with JSDoc lives in the plugin's Config, and
# README.md explains each one; this file shows the shape.
#
#   provider           route name requests select (default: opencode-go)
#   apiKeyEnv          credential REFERENCE resolved per request through the
#                      harness credential seam (default: OPENCODE_GO_API_KEY).
#                      The key value itself never belongs in this file.
#   baseURL            API root (default: https://opencode.ai/zen/go/v1)
#   userAgentProduct   product token leading the User-Agent
#   attribution        optional extra product token, e.g. deepseek-harness/0.2.0
#   timeoutMs / streamIdleTimeoutMs
#   modelSource        'discover' | 'config'
#   modelsCacheSeconds / modelsCachePath
#   models             advisory catalog entries
#   modelOverrides     reshape one catalog model
#   protocolOverrides  { "<model id>": "<protocol>" }
#   defaultProtocol    'chat-completions' by default
#   defaultContextWindow / defaultMaxTokens
#   reasoningEfforts   selectable thinking levels
#   sessionHeader      'session-id' | 'uuid' | 'off'
#   sendClientHeader   send x-opencode-client
#   disableReasoningReplay  stop replaying prior reasoning
#   hideTrainingModels      keep models that train on request data out of the list
#   hiddenModels       model ids to keep out of the list (hiding never disables one)
#   modelVariants      named presets of one model, each offered as <model>@<name>
#                      entries: [{ model, name, label?, protocol?, effort?,
#                                  contextWindow?, maxTokens? }]
#   healthCheck        'off' | 'startup'
#   retryPolicy        { mode, maxRetries, ... }
#   usagePath          where the usage counters live
#                      (default ~/.dsh/cache/opencode-go-usage.json)
#   subscriptionCacheSeconds
#                      how long the page reuses one subscription-quota answer
#                      before asking GET {baseURL}/usage again (default: 60)
#   subscriptionMinIntervalSeconds / subscriptionMaxIntervalSeconds
#                      how the page paces its own quota checks (defaults: 30 and
#                      1800). It checks at the floor while calls are being made
#                      and at the ceiling while they are not, asking a memory-only
#                      endpoint in between so that neither is a poll. Both are
#                      editable on the configuration page, where they are saved
#                      together and a floor above the ceiling is refused.
#
# The plugin also ships a page for the Web client: the sidebar's Plugins page
# lists this bundle, and the opencode-go row's Configure control opens it. It
# edits the API key, the credential reference, which models the listing offers,
# and the model variants; it re-reads GET /models on demand, and shows both the
# service's own subscription quota and what this route spent. See
# docs/configuration.md#graphical-configuration. The page needs a web server and
# is simply absent without one.
#
# Usage has three shallower entries besides that page, all reading the same
# facts (docs/configuration.md#fast-entries): a quota capsule at the sidebar's
# foot that opens a usage panel of its own (also Ctrl/Cmd+U on the desktop), and
# a usage tab under Settings -> Plugins. Each is registered only where the shell
# service behind it exists, so a deployment with no shortcuts registry or no
# plugins page simply has fewer of them.
- insert:
    - id: opencode-go
      name: dsh-llm-opencode-go
      config:
        provider: opencode-go
        apiKeyEnv: OPENCODE_GO_API_KEY
        baseURL: https://opencode.ai/zen/go/v1
